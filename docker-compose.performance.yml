# High-performance Docker Compose configuration for Medi Runner
# Optimized for minimal latency and maximum throughput

version: '3.8'

services:
  # Controller Backend - Robot Communication Hub
  controller-backend:
    build:
      context: ./controller-backend
      dockerfile: Dockerfile
      target: production
    container_name: medi-runner-backend
    restart: unless-stopped
    
    # Performance optimizations
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Network optimizations
    network_mode: host  # Use host networking for minimal latency
    
    # Alternative: bridge mode with optimizations
    # networks:
    #   - medi-runner-network
    # ports:
    #   - "3001:3001"
    
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ROBOT_HOST=${ROBOT_HOST:-192.168.1.100}
      - ROBOT_PORT=${ROBOT_PORT:-8765}
      - AUTO_CONNECT_ROBOT=${AUTO_CONNECT_ROBOT:-true}
      - JWT_SECRET=${JWT_SECRET:-medi-runner-secret-2025}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      
      # Performance tuning
      - UV_THREADPOOL_SIZE=16
      - NODE_OPTIONS=--max-old-space-size=512
      
    # Volumes for persistent data
    volumes:
      - backend-logs:/app/logs
      - /etc/localtime:/etc/localtime:ro
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Security
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/.next/cache:noexec,nosuid,size=50m
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # Controller Frontend - Dashboard Interface  
  controller-frontend:
    build:
      context: ./controller-frontend
      dockerfile: Dockerfile
      target: runner
    container_name: medi-runner-frontend
    restart: unless-stopped
    
    # Performance optimizations
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Network configuration
    ports:
      - "3000:3000"
    networks:
      - medi-runner-network
    
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      
      # Performance tuning
      - NODE_OPTIONS=--max-old-space-size=256
    
    # Dependencies
    depends_on:
      controller-backend:
        condition: service_healthy
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Security
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /app/.next/cache:noexec,nosuid,size=25m
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

  # Redis for session storage and caching (optional performance boost)
  redis:
    image: redis:7-alpine
    container_name: medi-runner-redis
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    
    networks:
      - medi-runner-network
    
    # Redis optimizations
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    
    volumes:
      - redis-data:/data
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx reverse proxy for load balancing (optional)
  nginx:
    image: nginx:alpine
    container_name: medi-runner-proxy
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    networks:
      - medi-runner-network
    
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    
    depends_on:
      - controller-frontend
      - controller-backend
    
    # Nginx performance tuning
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 32M

# Networks
networks:
  medi-runner-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: medi-runner-br0
      com.docker.network.driver.mtu: 1500

# Volumes for persistent data
volumes:
  backend-logs:
    driver: local
  redis-data:
    driver: local