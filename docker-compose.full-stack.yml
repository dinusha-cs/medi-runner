# Production Docker Compose for Medi Runner Challenge 2025
# Full-stack deployment with performance optimizations

version: '3.8'

networks:
  medi-runner:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  # Frontend Dashboard Service
  frontend:
    build:
      context: ./controller-frontend
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:3001
        NEXT_PUBLIC_WS_URL: ws://backend:3001
    image: medi-runner-frontend:latest
    container_name: medi-runner-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    networks:
      medi-runner:
        ipv4_address: 172.20.0.10
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./logs/frontend:/app/logs
    labels:
      - "medi-runner.service=frontend"
      - "medi-runner.environment=production"

  # Backend API Service
  backend:
    build:
      context: ./controller-backend
      dockerfile: Dockerfile
    image: medi-runner-backend:latest
    container_name: medi-runner-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=medirunner
      - DB_USER=medirunner
      - DB_PASS=secure_password_change_in_production
    networks:
      medi-runner:
        ipv4_address: 172.20.0.11
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    volumes:
      - ./logs/backend:/app/logs
      - ./data/uploads:/app/uploads
    labels:
      - "medi-runner.service=backend"
      - "medi-runner.environment=production"

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: medi-runner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis_password_change_in_production
    networks:
      medi-runner:
        ipv4_address: 172.20.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - redis_data:/data
    labels:
      - "medi-runner.service=redis"
      - "medi-runner.environment=production"

  # PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: medi-runner-database
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=medirunner
      - POSTGRES_USER=medirunner
      - POSTGRES_PASSWORD=secure_password_change_in_production
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      medi-runner:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medirunner -d medirunner"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    labels:
      - "medi-runner.service=database"
      - "medi-runner.environment=production"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: medi-runner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      medi-runner:
        ipv4_address: 172.20.0.14
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    labels:
      - "medi-runner.service=nginx"
      - "medi-runner.environment=production"

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: medi-runner-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      medi-runner:
        ipv4_address: 172.20.0.15
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    labels:
      - "medi-runner.service=monitoring"
      - "medi-runner.environment=production"

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: medi-runner-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      medi-runner:
        ipv4_address: 172.20.0.16
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_password_change_in_production
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    labels:
      - "medi-runner.service=monitoring"
      - "medi-runner.environment=production"

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# Health check and management scripts
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s