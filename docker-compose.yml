version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./controller-backend
      dockerfile: Dockerfile
    container_name: medi-runner-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/database.sqlite
      - ROBOT_WS_URL=ws://robot-server:8765
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      - ./data:/app/data
      - ./controller-backend/src:/app/src:ro
    depends_on:
      - robot-server
    restart: unless-stopped
    networks:
      - medi-runner-network

  # Frontend Dashboard Service
  frontend:
    build:
      context: ./controller-front-end
      dockerfile: Dockerfile
    container_name: medi-runner-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - medi-runner-network

  # Robot Server (for simulation/development)
  robot-server:
    build:
      context: ./robot-server
      dockerfile: Dockerfile.simulation
    container_name: medi-runner-robot
    ports:
      - "8765:8765"
    environment:
      - SIMULATION_MODE=true
      - DEBUG=true
    volumes:
      - ./robot-server:/app:ro
    restart: unless-stopped
    networks:
      - medi-runner-network

  # Database (PostgreSQL for production)
  database:
    image: postgres:15-alpine
    container_name: medi-runner-db
    environment:
      - POSTGRES_DB=medi_runner
      - POSTGRES_USER=medi_user
      - POSTGRES_PASSWORD=medi_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - medi-runner-network

  # Redis for session management and caching
  redis:
    image: redis:7-alpine
    container_name: medi-runner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - medi-runner-network

  # Nginx for reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: medi-runner-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - medi-runner-network
    profiles:
      - production

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: medi-runner-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - medi-runner-network
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: medi-runner-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - medi-runner-network
    profiles:
      - monitoring

networks:
  medi-runner-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
