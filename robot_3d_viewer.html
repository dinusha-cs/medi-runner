<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi Runner 3D Robot Simulation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .status-item {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            min-width: 200px;
        }
        
        .status-value {
            font-weight: bold;
            color: #4CAF50;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .control-btn {
            margin: 5px;
            padding: 10px 15px;
            background: #2196F3;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .control-btn:hover {
            background: #1976D2;
        }
        
        .control-btn:active {
            background: #0D47A1;
        }
        
        .emergency {
            background: #f44336 !important;
        }
        
        .emergency:hover {
            background: #d32f2f !important;
        }
        
        #connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        
        .connected {
            color: #4CAF50;
        }
        
        .disconnected {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Three.js canvas will be inserted here -->
        
        <!-- Status Panel -->
        <div id="ui">
            <h3>🤖 Robot Status</h3>
            <div class="status-item">
                <span>Position:</span>
                <span id="position" class="status-value">0, 0</span>
            </div>
            <div class="status-item">
                <span>Angle:</span>
                <span id="angle" class="status-value">0°</span>
            </div>
            <div class="status-item">
                <span>Speed:</span>
                <span id="speed" class="status-value">0</span>
            </div>
            <div class="status-item">
                <span>Battery:</span>
                <span id="battery" class="status-value">85%</span>
            </div>
            <div class="status-item">
                <span>Status:</span>
                <span id="status" class="status-value">Idle</span>
            </div>
            <div class="status-item">
                <span>Distance:</span>
                <span id="distance" class="status-value">200cm</span>
            </div>
        </div>
        
        <!-- Connection Status -->
        <div id="connection-status">
            <span id="ws-status" class="disconnected">⚡ Disconnected</span>
        </div>
        
        <!-- Controls -->
        <div id="controls">
            <h4>🎮 Robot Controls</h4>
            <div>
                <button class="control-btn" onclick="sendCommand('move', {direction: 'forward', speed: 50, duration: 2})">⬆️ Forward</button>
                <button class="control-btn" onclick="sendCommand('move', {direction: 'backward', speed: 50, duration: 2})">⬇️ Backward</button>
            </div>
            <div>
                <button class="control-btn" onclick="sendCommand('move', {direction: 'left', speed: 40, duration: 1})">⬅️ Left</button>
                <button class="control-btn" onclick="sendCommand('stop')">🛑 Stop</button>
                <button class="control-btn" onclick="sendCommand('move', {direction: 'right', speed: 40, duration: 1})">➡️ Right</button>
            </div>
            <div>
                <button class="control-btn" onclick="navigateToRoom('pharmacy')">🏥 Pharmacy</button>
                <button class="control-btn" onclick="navigateToRoom('101')">🚪 Room 101</button>
                <button class="control-btn" onclick="navigateToRoom('base')">🏠 Base</button>
            </div>
            <div>
                <button class="control-btn emergency" onclick="emergencyStop()">🚨 EMERGENCY STOP</button>
            </div>
        </div>
    </div>
    
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D Scene Setup
        let scene, camera, renderer, robot, hospitalMap;
        let ws = null;
        let robotPosition = { x: 0, y: 0, z: 0 };
        let robotRotation = 0;
        
        // Initialize 3D Scene
        function init3D() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Sky blue
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 100);
            camera.lookAt(0, 0, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(100, 100, 50);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Create hospital environment
            createHospitalEnvironment();
            
            // Create robot
            createRobot();
            
            // Start animation loop
            animate();
        }
        
        function createHospitalEnvironment() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(400, 300);
            const floorMaterial = new THREE.MeshLambertMaterial({ color: 0xf0f0f0 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Hospital rooms
            const rooms = [
                { name: 'Base', x: -150, z: -100, width: 40, height: 30, color: 0x4CAF50 },
                { name: 'Pharmacy', x: -50, z: -50, width: 50, height: 35, color: 0x2196F3 },
                { name: 'Room 101', x: 50, z: -75, width: 45, height: 30, color: 0xFF9800 },
                { name: 'Room 102', x: 50, z: -25, width: 45, height: 30, color: 0xFF9800 },
                { name: 'Surgery', x: 100, z: 50, width: 60, height: 40, color: 0xF44336 },
                { name: 'ICU', x: 150, z: 75, width: 70, height: 50, color: 0x9C27B0 }
            ];
            
            rooms.forEach(room => {
                // Room walls
                const wallGeometry = new THREE.BoxGeometry(room.width, 15, room.height);
                const wallMaterial = new THREE.MeshLambertMaterial({ color: room.color, transparent: true, opacity: 0.8 });
                const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                wall.position.set(room.x, 7.5, room.z);
                wall.castShadow = true;
                scene.add(wall);
                
                // Room label
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = 256;
                canvas.height = 64;
                context.fillStyle = 'white';
                context.fillRect(0, 0, 256, 64);
                context.fillStyle = 'black';
                context.font = 'bold 20px Arial';
                context.textAlign = 'center';
                context.fillText(room.name, 128, 35);
                
                const texture = new THREE.CanvasTexture(canvas);
                const labelMaterial = new THREE.MeshBasicMaterial({ map: texture });
                const labelGeometry = new THREE.PlaneGeometry(20, 5);
                const label = new THREE.Mesh(labelGeometry, labelMaterial);
                label.position.set(room.x, 20, room.z);
                label.lookAt(camera.position);
                scene.add(label);
            });
            
            // Corridors (simple lines for now)
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 3 });
            
            // Main horizontal corridor
            const horizontalPoints = [
                new THREE.Vector3(-200, 1, 0),
                new THREE.Vector3(200, 1, 0)
            ];
            const horizontalGeometry = new THREE.BufferGeometry().setFromPoints(horizontalPoints);
            const horizontalLine = new THREE.Line(horizontalGeometry, lineMaterial);
            scene.add(horizontalLine);
            
            // Vertical corridors
            const verticalPoints1 = [
                new THREE.Vector3(-100, 1, -150),
                new THREE.Vector3(-100, 1, 150)
            ];
            const verticalGeometry1 = new THREE.BufferGeometry().setFromPoints(verticalPoints1);
            const verticalLine1 = new THREE.Line(verticalGeometry1, lineMaterial);
            scene.add(verticalLine1);
        }
        
        function createRobot() {
            // Robot group
            robot = new THREE.Group();
            
            // Robot body
            const bodyGeometry = new THREE.BoxGeometry(12, 4, 8);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0x2196F3 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 2;
            body.castShadow = true;
            robot.add(body);
            
            // Direction indicator (arrow)
            const arrowGeometry = new THREE.ConeGeometry(1, 4);
            const arrowMaterial = new THREE.MeshLambertMaterial({ color: 0xFF5722 });
            const arrow = new THREE.Mesh(arrowGeometry, arrowMaterial);
            arrow.position.set(8, 4, 0);
            arrow.rotation.z = -Math.PI / 2;
            robot.add(arrow);
            
            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(2, 2, 1.5);
            const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x424242 });
            
            const leftWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            leftWheel.position.set(-3, 1, 4);
            leftWheel.rotation.z = Math.PI / 2;
            robot.add(leftWheel);
            
            const rightWheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            rightWheel.position.set(-3, 1, -4);
            rightWheel.rotation.z = Math.PI / 2;
            robot.add(rightWheel);
            
            // Sensor visualization
            const sensorGeometry = new THREE.SphereGeometry(0.5);
            const sensorMaterial = new THREE.MeshLambertMaterial({ color: 0x4CAF50 });
            const sensor = new THREE.Mesh(sensorGeometry, sensorMaterial);
            sensor.position.set(6, 3, 0);
            robot.add(sensor);
            
            robot.position.set(robotPosition.x, 0, robotPosition.z);
            scene.add(robot);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update robot position
            if (robot) {
                robot.position.x = robotPosition.x / 10; // Scale for display
                robot.position.z = robotPosition.y / 10;
                robot.rotation.y = (robotRotation * Math.PI) / 180;
            }
            
            // Camera follows robot
            if (robot) {
                camera.position.x = robot.position.x + 30;
                camera.position.z = robot.position.z + 50;
                camera.lookAt(robot.position);
            }
            
            renderer.render(scene, camera);
        }
        
        // WebSocket Connection
        function connectWebSocket() {
            const wsUrl = 'ws://localhost:8765';
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = function() {
                    console.log('✅ WebSocket connected to robot server');
                    document.getElementById('ws-status').textContent = '⚡ Connected';
                    document.getElementById('ws-status').className = 'connected';
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        updateRobotStatus(data);
                    } catch (e) {
                        console.log('📥 WebSocket message:', event.data);
                    }
                };
                
                ws.onclose = function() {
                    console.log('❌ WebSocket connection closed');
                    document.getElementById('ws-status').textContent = '⚡ Disconnected';
                    document.getElementById('ws-status').className = 'disconnected';
                    
                    // Try to reconnect after 3 seconds
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = function(error) {
                    console.error('❌ WebSocket error:', error);
                };
                
            } catch (error) {
                console.error('❌ WebSocket connection failed:', error);
                document.getElementById('ws-status').textContent = '⚡ Connection Failed';
                document.getElementById('ws-status').className = 'disconnected';
            }
        }
        
        // Update robot status display
        function updateRobotStatus(data) {
            if (data.type === 'status_update' || data.type === 'status') {
                const robotData = data.data;
                
                if (robotData.motor && robotData.motor.position) {
                    const pos = robotData.motor.position;
                    robotPosition.x = pos.x || 0;
                    robotPosition.y = pos.y || 0;
                    robotRotation = pos.angle || 0;
                    
                    document.getElementById('position').textContent = `${pos.x?.toFixed(1) || 0}, ${pos.y?.toFixed(1) || 0}`;
                    document.getElementById('angle').textContent = `${pos.angle?.toFixed(1) || 0}°`;
                }
                
                if (robotData.motor && robotData.motor.motors) {
                    const motors = robotData.motor.motors;
                    const speed = Math.max(Math.abs(motors.left_speed || 0), Math.abs(motors.right_speed || 0));
                    document.getElementById('speed').textContent = speed;
                    document.getElementById('status').textContent = motors.direction || 'idle';
                }
                
                if (robotData.sensors && robotData.sensors.battery) {
                    document.getElementById('battery').textContent = `${robotData.sensors.battery.percentage || 85}%`;
                }
                
                if (robotData.sensors && robotData.sensors.ultrasonic) {
                    document.getElementById('distance').textContent = `${robotData.sensors.ultrasonic.distance || 200}cm`;
                }
            }
        }
        
        // Send commands to robot
        function sendCommand(action, params = {}) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('❌ Not connected to robot server!');
                return;
            }
            
            const command = {
                type: 'command',
                id: 'web_' + Date.now(),
                data: {
                    action: action,
                    ...params
                }
            };
            
            ws.send(JSON.stringify(command));
            console.log('📤 Sent command:', command);
        }
        
        function navigateToRoom(room) {
            const roomTargets = {
                'pharmacy': { x: 200, y: 100 },
                '101': { x: 400, y: 80 },
                'base': { x: 50, y: 50 },
                'surgery': { x: 300, y: 250 },
                'icu': { x: 500, y: 200 }
            };
            
            const target = roomTargets[room];
            if (target) {
                sendCommand('navigate_to', { target: target });
            }
        }
        
        function emergencyStop() {
            sendCommand('emergency_stop');
            alert('🚨 EMERGENCY STOP ACTIVATED!');
        }
        
        // Keyboard controls
        document.addEventListener('keydown', function(event) {
            switch(event.code) {
                case 'KeyW':
                    sendCommand('move', { direction: 'forward', speed: 50, duration: 2 });
                    break;
                case 'KeyS':
                    sendCommand('move', { direction: 'backward', speed: 50, duration: 2 });
                    break;
                case 'KeyA':
                    sendCommand('move', { direction: 'left', speed: 40, duration: 1 });
                    break;
                case 'KeyD':
                    sendCommand('move', { direction: 'right', speed: 40, duration: 1 });
                    break;
                case 'Space':
                    event.preventDefault();
                    sendCommand('stop');
                    break;
                case 'Escape':
                    emergencyStop();
                    break;
            }
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize everything when page loads
        window.addEventListener('load', function() {
            console.log('🚀 Starting 3D Robot Simulation');
            init3D();
            connectWebSocket();
        });
        
        // Demo mode - simulate robot movement when not connected
        let demoMode = false;
        setTimeout(() => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                demoMode = true;
                console.log('📊 Starting demo mode - simulating robot data');
                
                setInterval(() => {
                    // Simulate robot movement
                    robotPosition.x += (Math.random() - 0.5) * 5;
                    robotPosition.y += (Math.random() - 0.5) * 5;
                    robotRotation += (Math.random() - 0.5) * 10;
                    
                    // Update UI
                    document.getElementById('position').textContent = `${robotPosition.x.toFixed(1)}, ${robotPosition.y.toFixed(1)}`;
                    document.getElementById('angle').textContent = `${robotRotation.toFixed(1)}°`;
                    document.getElementById('speed').textContent = Math.floor(Math.random() * 60);
                    document.getElementById('status').textContent = ['moving', 'idle', 'turning'][Math.floor(Math.random() * 3)];
                }, 1000);
            }
        }, 5000);
        
    </script>
</body>
</html>
