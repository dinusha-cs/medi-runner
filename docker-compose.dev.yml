# Development Docker Compose configuration
# Optimized for fast development with hot reloading

version: '3.8'

services:
  # Controller Backend - Development Mode
  controller-backend:
    build:
      context: ./controller-backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: medi-runner-backend-dev
    restart: unless-stopped
    
    # Development optimizations
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    
    ports:
      - "3001:3001"
      - "9229:9229"  # Node.js debugger
    
    networks:
      - medi-runner-dev
    
    environment:
      - NODE_ENV=development
      - DEBUG=*
      - PORT=3001
      - ROBOT_HOST=${ROBOT_HOST:-localhost}
      - ROBOT_PORT=${ROBOT_PORT:-8765}
      - AUTO_CONNECT_ROBOT=false  # Manual connection in dev
      - JWT_SECRET=dev-secret-key
      - LOG_LEVEL=debug
    
    # Volume mounts for hot reloading
    volumes:
      - ./controller-backend/src:/app/src
      - ./controller-backend/package.json:/app/package.json
      - backend-node-modules:/app/node_modules
      - backend-logs:/app/logs
    
    # Development command with nodemon
    command: npm run dev
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Controller Frontend - Development Mode
  controller-frontend:
    build:
      context: ./controller-frontend
      dockerfile: Dockerfile.dev
      target: development
    container_name: medi-runner-frontend-dev
    restart: unless-stopped
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    
    ports:
      - "3000:3000"
    
    networks:
      - medi-runner-dev
    
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      - WATCHPACK_POLLING=true  # Enable polling for file changes
    
    # Volume mounts for hot reloading
    volumes:
      - ./controller-frontend/src:/app/src
      - ./controller-frontend/public:/app/public
      - ./controller-frontend/package.json:/app/package.json
      - ./controller-frontend/next.config.js:/app/next.config.js
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    
    # Development command
    command: npm run dev
    
    # Dependencies
    depends_on:
      - controller-backend
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Development database (SQLite in dev, PostgreSQL in prod)
  database:
    image: postgres:15-alpine
    container_name: medi-runner-db-dev
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=medi_runner_dev
      - POSTGRES_USER=dev_user
      - POSTGRES_PASSWORD=dev_password
    
    ports:
      - "5432:5432"
    
    networks:
      - medi-runner-dev
    
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d medi_runner_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for development caching
  redis:
    image: redis:7-alpine
    container_name: medi-runner-redis-dev
    restart: unless-stopped
    
    ports:
      - "6379:6379"
    
    networks:
      - medi-runner-dev
    
    volumes:
      - redis-data:/data
    
    # Health check
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

# Networks
networks:
  medi-runner-dev:
    driver: bridge
    name: medi-runner-dev-network

# Volumes
volumes:
  backend-node-modules:
  frontend-node-modules:
  frontend-next:
  backend-logs:
  db-data:
  redis-data: